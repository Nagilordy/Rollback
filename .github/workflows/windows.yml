# Builds Rollback for Windows and packs it into one installer, RollbackSetup.exe.
# Runs on GitHub's Windows machines when a release tag like v0.3 is created (it attaches
# RollbackSetup.exe to that release), or by hand (Actions tab > Windows installer > Run workflow).
# Uploading files to main doesn't start it.

name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8  # the version Rollback is tested with
          cache: true

      # Adds the Windows part of the project if it isn't in the repository yet.
      - name: Windows project files
        shell: pwsh
        run: if (-not (Test-Path windows)) { flutter create --platforms=windows --project-name player_test . }

      # Rollback's own icon (taskbar, window, Start menu, .exe) instead of Flutter's default.
      - name: Rollback icon
        shell: pwsh
        run: Copy-Item packaging\app_icon.ico windows\runner\resources\app_icon.ico -Force

      # "Rollback" everywhere Windows shows a name, instead of the project's internal name
      # (player_test): the program is Rollback.exe, and Task Manager, the taskbar, "Open with" and
      # the window's first title all say Rollback.
      - name: Rollback's name on Windows
        shell: pwsh
        run: |
          $cmake = 'windows\CMakeLists.txt'
          (Get-Content $cmake -Raw) -replace 'set\(BINARY_NAME "[^"]*"\)', 'set(BINARY_NAME "Rollback")' | Set-Content $cmake -NoNewline
          $rc = 'windows\runner\Runner.rc'
          $t = Get-Content $rc -Raw
          # CompanyName and ProductName stay as they were: Windows keeps Rollback's settings, sign-in
          # and downloads in a folder named after them, so changing them would lose everything.
          $t = $t -replace '(VALUE "FileDescription", )"[^"]*"', '$1"Rollback"'
          $t = $t -replace '(VALUE "InternalName", )"[^"]*"', '$1"Rollback"'
          $t = $t -replace '(VALUE "OriginalFilename", )"[^"]*"', '$1"Rollback.exe"'
          Set-Content $rc $t -NoNewline
          $main = 'windows\runner\main.cpp'
          (Get-Content $main -Raw) -replace 'window\.Create\(L"[^"]*"', 'window.Create(L"Rollback"' | Set-Content $main -NoNewline
          Select-String -Path $cmake -Pattern 'BINARY_NAME'
          Select-String -Path $rc -Pattern 'FileDescription|OriginalFilename'
          Select-String -Path $main -Pattern 'window.Create'

      - name: Build
        # SENTRY_DSN (a repository secret) turns on crash reports; empty = off.
        run: flutter build windows --release --dart-define=FRAME_BUILD=${{ github.sha }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Check the program name
        shell: pwsh
        run: |
          if (-not (Test-Path build\windows\x64\runner\Release\Rollback.exe)) { throw "Rollback.exe missing: the rename didn't apply" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Make the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\rollback.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RollbackSetup
          path: installer\Output\RollbackSetup.exe

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/RollbackSetup.exe
