# Builds Rollback for Windows and packs it into one installer, RollbackSetup.exe.
# Runs on GitHub's Windows machines when a release tag like v0.3 is created (it attaches
# RollbackSetup.exe to that release), or by hand (Actions tab > Windows installer > Run workflow).
# Uploading files to main doesn't start it.

name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8  # the version Rollback is tested with
          cache: true

      # Adds the Windows part of the project if it isn't in the repository yet.
      - name: Windows project files
        shell: pwsh
        run: if (-not (Test-Path windows)) { flutter create --platforms=windows --project-name player_test . }

      # Rollback's own icon (taskbar, window, Start menu, .exe) instead of Flutter's default.
      - name: Rollback icon
        shell: pwsh
        run: Copy-Item packaging\app_icon.ico windows\runner\resources\app_icon.ico -Force

      # "Rollback" everywhere Windows shows a name, instead of the project's internal name
      # (player_test): the program is Rollback.exe, and Task Manager, the taskbar, "Open with" and
      # the window's first title all say Rollback.
      - name: Rollback's name on Windows
        shell: pwsh
        run: |
          $cmake = 'windows\CMakeLists.txt'
          (Get-Content $cmake -Raw) -replace 'set\(BINARY_NAME "[^"]*"\)', 'set(BINARY_NAME "Rollback")' | Set-Content $cmake -NoNewline
          $rc = 'windows\runner\Runner.rc'
          $t = Get-Content $rc -Raw
          # CompanyName and ProductName stay as they were: Windows keeps Rollback's settings, sign-in
          # and downloads in a folder named after them, so changing them would lose everything.
          $t = $t -replace '(VALUE "FileDescription", )"[^"]*"', '$1"Rollback"'
          $t = $t -replace '(VALUE "InternalName", )"[^"]*"', '$1"Rollback"'
          $t = $t -replace '(VALUE "OriginalFilename", )"[^"]*"', '$1"Rollback.exe"'
          Set-Content $rc $t -NoNewline
          $main = 'windows\runner\main.cpp'
          (Get-Content $main -Raw) -replace 'window\.Create\(L"[^"]*"', 'window.Create(L"Rollback"' | Set-Content $main -NoNewline
          Select-String -Path $cmake -Pattern 'BINARY_NAME'
          Select-String -Path $rc -Pattern 'FileDescription|OriginalFilename'
          Select-String -Path $main -Pattern 'window.Create'

      # Rollback's own LGPL video engine (libmpv + FFmpeg, packaging/windows/build-lgpl-libmpv.sh),
      # instead of media_kit's, which leaves out Dolby TrueHD and Blu-ray (PGS) subtitles.
      # Built once and cached until the script changes.
      - name: Engine cache
        id: engine
        uses: actions/cache@v4
        with:
          path: |
            lgpl-win/out
            lgpl-win/src/*.tar.*
          key: lgpl-libmpv-windows-${{ hashFiles('packaging/windows/build-lgpl-libmpv.sh') }}

      - name: MSYS2 (to build the engine)
        if: steps.engine.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make tar xz curl diffutils
          pacboy: >-
            toolchain:p meson:p ninja:p nasm:p pkgconf:p
            libass:p libplacebo:p dav1d:p shaderc:p spirv-cross:p
            vulkan-headers:p vulkan-loader:p lcms2:p libjpeg-turbo:p zimg:p uchardet:p
            opus:p libvpx:p libxml2:p zlib:p ffnvcodec-headers:p

      - name: Build the engine
        if: steps.engine.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/windows/build-lgpl-libmpv.sh lgpl-win

      - name: Build
        # SENTRY_DSN (a repository secret) turns on crash reports; empty = off.
        run: flutter build windows --release --dart-define=FRAME_BUILD=${{ github.sha }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Check the program name
        shell: pwsh
        run: |
          if (-not (Test-Path build\windows\x64\runner\Release\Rollback.exe)) { throw "Rollback.exe missing: the rename didn't apply" }

      # media_kit's libmpv-2.dll out, Rollback's engine in (with the DLLs it needs and its licences).
      - name: Use Rollback's engine
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$rel\libmpv-2.dll")) { throw "No libmpv-2.dll in the build: nothing to replace" }
          if (-not (Test-Path 'lgpl-win\out\libmpv-2.dll')) { throw "Rollback's engine is missing" }
          Copy-Item lgpl-win\out\* $rel -Recurse -Force
          Get-ChildItem $rel -Filter *.dll | Select-Object Name, Length

      # Everything that ships, listed in the log, and a stop if a GPL-only or unexpected kind
      # of library got in (see THIRD_PARTY_NOTICES.md for what each file is).
      - name: What ships (licence check)
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          Get-ChildItem $rel -Recurse -File | Sort-Object FullName | ForEach-Object {
            '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring((Resolve-Path $rel).Path.Length + 1)
          }
          $bad = Get-ChildItem $rel -Recurse -File | Where-Object { $_.Name -match '(x264|x265|xvid|postproc|rubberband|fftw|jvm)' }
          if ($bad) { throw "Must not ship: $($bad.Name -join ', ')" }
          # FFmpeg is in its own DLLs next to libmpv-2.dll: its licence string must say LGPL.
          $avutil = Get-ChildItem $rel -Filter 'avutil-*.dll' | Select-Object -First 1
          if (-not $avutil) { throw 'No FFmpeg (avutil-*.dll) next to libmpv-2.dll' }
          $text = [IO.File]::ReadAllText($avutil.FullName, [Text.Encoding]::ASCII)
          if ($text -notmatch 'LGPL version' -or $text -match 'nonfree and unredistributable') { throw "$($avutil.Name) is not the LGPL build" }
          "$($avutil.Name): LGPL build"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Make the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { ((Select-String -Path installer\rollback.iss -Pattern '#define AppVersion "([0-9.]+)"').Matches[0].Groups[1].Value) }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\rollback.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RollbackSetup
          path: installer\Output\RollbackSetup.exe

      # Windows joins the releases once it has been tested: until then the installer stays a
      # build download only. To attach it, set the repository variable RELEASE_WINDOWS to true
      # (Settings > Secrets and variables > Actions > Variables).
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WINDOWS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/RollbackSetup.exe
