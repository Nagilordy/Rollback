# Checks Rollback's code on every upload to main, dev and linux-dev (and every pull request), in
# about two minutes, so a mistake shows up long before a 25-minute Windows build fails on it:
# - flutter analyze: finds code that wouldn't build or is likely wrong (errors and warnings fail
#   the check; style hints don't)
# - flutter test: the automated tests in test/ (playback rules, tracks, downloads, item text)
# A red ✗ next to a commit on GitHub means one of these failed: the build would break or a rule
# changed. Nothing here needs a phone or a Mac.

name: Check code

on:
  push:
    branches: [main, dev, linux-dev]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8  # the version Rollback is tested with
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Look for code that wouldn't build
        run: flutter analyze --no-fatal-infos

      - name: Run the automated tests
        run: flutter test --reporter expanded
