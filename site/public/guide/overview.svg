<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="16" fill="#16181c"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e4a15a"/></marker>
  </defs>
  <!-- 1 media -->
  <g transform="translate(40 50)">
    <rect width="240" height="200" rx="14" fill="#0d0e10" stroke="#2a2e35"/>
    <text x="120" y="38" fill="#e4a15a" font-size="15" font-weight="700" text-anchor="middle">1 · YOUR FILMS AND SHOWS</text>
    <path d="M70 70h40l10 12h60v70H70z" fill="#2a2e35"/>
    <path d="M70 92h110v60H70z" fill="#3a3f48"/>
    <rect x="86" y="104" width="22" height="32" rx="3" fill="#e4a15a"/>
    <rect x="114" y="104" width="22" height="32" rx="3" fill="#8e97a6"/>
    <rect x="142" y="104" width="22" height="32" rx="3" fill="#d3d8e0"/>
    <text x="120" y="182" fill="#d3d8e0" font-size="14" text-anchor="middle">Video files in folders</text>
  </g>
  <line x1="290" y1="150" x2="350" y2="150" stroke="#e4a15a" stroke-width="3" marker-end="url(#a)"/>
  <!-- 2 server -->
  <g transform="translate(360 50)">
    <rect width="240" height="200" rx="14" fill="#0d0e10" stroke="#e4a15a"/>
    <text x="120" y="38" fill="#e4a15a" font-size="15" font-weight="700" text-anchor="middle">2 · JELLYFIN SERVER</text>
    <rect x="80" y="62" width="80" height="94" rx="8" fill="#2a2e35"/>
    <rect x="92" y="76" width="56" height="8" rx="4" fill="#3a3f48"/>
    <rect x="92" y="92" width="56" height="8" rx="4" fill="#3a3f48"/>
    <rect x="92" y="108" width="56" height="8" rx="4" fill="#3a3f48"/>
    <circle cx="140" cy="138" r="5" fill="#7bd88f"/>
    <text x="120" y="182" fill="#d3d8e0" font-size="14" text-anchor="middle">A PC or NAS that's left on</text>
  </g>
  <line x1="610" y1="150" x2="670" y2="150" stroke="#e4a15a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="640" y="135" fill="#8e97a6" font-size="12" text-anchor="middle">home network</text>
  <!-- 3 rollback -->
  <g transform="translate(680 50)">
