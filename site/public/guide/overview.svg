    <rect x="58" y="68" width="124" height="66" rx="3" fill="#3a3f48"/>
    <rect x="66" y="104" width="22" height="24" rx="2" fill="#e4a15a"/>
    <rect x="92" y="104" width="22" height="24" rx="2" fill="#8e97a6"/>
    <rect x="118" y="104" width="22" height="24" rx="2" fill="#8e97a6"/>
    <rect x="144" y="104" width="22" height="24" rx="2" fill="#8e97a6"/>
    <rect x="104" y="142" width="32" height="8" fill="#2a2e35"/>
    <text x="120" y="182" fill="#d3d8e0" font-size="14" text-anchor="middle">On the PC by your TV</text>
